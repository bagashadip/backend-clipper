# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml  —  local development & integration testing
#
# Prerequisites:
#   - NVIDIA GPU + drivers on the host
#   - NVIDIA Container Toolkit  (https://docs.nvidia.com/datacenter/cloud-native/)
#
# Usage:
#   docker compose up --build
#
# GCP deployment note:
#   - Push the backend image to Artifact Registry, then deploy to GKE with a
#     GPU node pool (T4 / L4) or GCE with the nvidia-container-toolkit installed.
#   - Set GPU resource requests in the GKE deployment manifest for the worker.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clipper
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── bgutil PO Token provider (generates YouTube proof-of-origin tokens) ──
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider
    restart: unless-stopped
    init: true
    ports:
      - "4416:4416"

  # ── FastAPI API server (CPU — no GPU needed) ──────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/clipper
      REDIS_URL: redis://redis:6379/0
      HF_HOME: /app/.cache/huggingface
      DOWNLOAD_PROXY_URL: ${DOWNLOAD_PROXY_URL}
      BGUTIL_PROVIDER_URL: http://bgutil-provider:4416
    ports:
      - "8000:8000"
    volumes:
      - whisper_cache:/app/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # ── Celery worker  (GPU required for h264_nvenc) ──────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    restart: unless-stopped
    command:
      - "celery"
      - "-A"
      - "app.tasks.celery_app"
      - "worker"
      - "--loglevel=info"
      - "--concurrency=2"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/clipper
      REDIS_URL: redis://redis:6379/0
      HF_HOME: /app/.cache/huggingface
      TRITON_CACHE_DIR: /tmp/.triton
      DOWNLOAD_PROXY_URL: ${DOWNLOAD_PROXY_URL}
      BGUTIL_PROVIDER_URL: http://bgutil-provider:4416
    volumes:
      - whisper_cache:/app/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Expose the NVIDIA GPU to the container for h264_nvenc
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, video]

volumes:
  postgres_data:
  redis_data:
  whisper_cache:
