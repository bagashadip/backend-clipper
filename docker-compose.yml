# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml  —  local development & integration testing
#
# Prerequisites:
#   - NVIDIA GPU + drivers on the host
#   - NVIDIA Container Toolkit  (https://docs.nvidia.com/datacenter/cloud-native/)
#
# Usage:
#   docker compose up --build
#
# GCP deployment note:
#   - Push the backend image to Artifact Registry, then deploy to GKE with a
#     GPU node pool (T4 / L4) or GCE with the nvidia-container-toolkit installed.
#   - Set GPU resource requests in the GKE deployment manifest for the worker.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: T33d3vsu1yiDksGjozTj
      POSTGRES_DB: clipper
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    # Localhost-only publish so the host-network worker can reach us
    # without exposing Redis to the public internet.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── bgutil PO Token provider (generates YouTube proof-of-origin tokens) ──
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider
    restart: unless-stopped
    init: true
    # Localhost-only publish so the host-network worker can reach us
    # without exposing the provider externally.
    ports:
      - "127.0.0.1:4416:4416"

  # ── FastAPI API server (CPU — no GPU needed) ──────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:T33d3vsu1yiDksGjozTj@postgres:5432/clipper
      REDIS_URL: redis://redis:6379/0
      HF_HOME: /app/.cache/huggingface
      BGUTIL_PROVIDER_URL: http://bgutil-provider:4416
      GROQ_API_KEY: ${GROQ_API_KEY}
      # Disable IPv6 rotation in the API container — it's on Docker bridge
      # networking and can't bind to host IPv6 addresses. Only the worker
      # (network_mode: host) should rotate.
      IPV6_ROTATION_PREFIX: ""
    ports:
      - "8000:8000"
    volumes:
      - whisper_cache:/app/.cache/huggingface
      - ytdlp_cache:/app/.cache/yt-dlp
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5

  # ── Celery worker  (CPU — no GPU needed) ──────────────────────────
  # Runs with network_mode: host so we can bind outbound connections to
  # rotating IPv6 addresses from the host's /64 block (used by yt-dlp's
  # source-address rotation in app/services/ipv6_rotator.py).
  #
  # Side effect: the worker can no longer use Docker's internal DNS for
  # service-to-service communication. We must reach postgres/redis/bgutil
  # via their published ports on localhost.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    restart: unless-stopped
    network_mode: "host"
    command:
      - "celery"
      - "-A"
      - "app.tasks.celery_app"
      - "worker"
      - "--loglevel=info"
      - "--concurrency=2"
    env_file: .env
    environment:
      # All addresses are on the host because of network_mode: host
      DATABASE_URL: postgresql://postgres:T33d3vsu1yiDksGjozTj@127.0.0.1:5432/clipper
      REDIS_URL: redis://127.0.0.1:6379/0
      BGUTIL_PROVIDER_URL: http://127.0.0.1:4416
      GROQ_API_KEY: ${GROQ_API_KEY}
      # IPv6 source-address rotation prefix (your VPS's /64 block)
      IPV6_ROTATION_PREFIX: ${IPV6_ROTATION_PREFIX:-}
    volumes:
      - whisper_cache:/app/.cache/huggingface
      - ytdlp_cache:/app/.cache/yt-dlp
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true

volumes:
  postgres_data:
  redis_data:
  whisper_cache:
  ytdlp_cache:
