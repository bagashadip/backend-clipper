# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml  —  local development & integration testing
#
# Prerequisites:
#   - NVIDIA GPU + drivers on the host
#   - NVIDIA Container Toolkit  (https://docs.nvidia.com/datacenter/cloud-native/)
#
# Usage:
#   docker compose up --build
#
# GCP deployment note:
#   - Push the backend image to Artifact Registry, then deploy to GKE with a
#     GPU node pool (T4 / L4) or GCE with the nvidia-container-toolkit installed.
#   - Set GPU resource requests in the GKE deployment manifest for the worker.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: T33d3vsu1yiDksGjozTj
      POSTGRES_DB: clipper
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── bgutil PO Token provider (generates YouTube proof-of-origin tokens) ──
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider
    restart: unless-stopped
    init: true
    ports:
      - "4416:4416"

  # ── FastAPI API server (CPU — no GPU needed) ──────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/clipper
      REDIS_URL: redis://redis:6379/0
      HF_HOME: /app/.cache/huggingface
      BGUTIL_PROVIDER_URL: http://bgutil-provider:4416
      GROQ_API_KEY: ${GROQ_API_KEY}
    ports:
      - "8000:8000"
    volumes:
      - whisper_cache:/app/.cache/huggingface
      - ytdlp_cache:/app/.cache/yt-dlp
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5

  # ── Celery worker  (CPU — no GPU needed) ──────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    restart: unless-stopped
    command:
      - "celery"
      - "-A"
      - "app.tasks.celery_app"
      - "worker"
      - "--loglevel=info"
      - "--concurrency=2"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/clipper
      REDIS_URL: redis://redis:6379/0
      BGUTIL_PROVIDER_URL: http://bgutil-provider:4416
      GROQ_API_KEY: ${GROQ_API_KEY}
    volumes:
      - whisper_cache:/app/.cache/huggingface
      - ytdlp_cache:/app/.cache/yt-dlp
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true

volumes:
  postgres_data:
  redis_data:
  whisper_cache:
  ytdlp_cache:
