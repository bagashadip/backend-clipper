# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml  —  local development & integration testing
#
# Prerequisites:
#   - NVIDIA GPU + drivers on the host
#   - NVIDIA Container Toolkit  (https://docs.nvidia.com/datacenter/cloud-native/)
#
# Usage:
#   docker compose up --build
#
# GCP deployment note:
#   - Push the backend image to Artifact Registry, then deploy to GKE with a
#     GPU node pool (T4 / L4) or GCE with the nvidia-container-toolkit installed.
#   - Set GPU resource requests in the GKE deployment manifest for the worker.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── BgUtils POT Provider ──────────────────────────────────────────────────
  # Generates YouTube Proof-of-Origin tokens automatically so yt-dlp can
  # download from datacenter IPs without manual cookie rotation.
  # Plugin docs: https://github.com/Brainicism/bgutil-ytdlp-pot-provider
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped
    # Port 4416 is exposed to other containers via the default docker network.
    # No host-port mapping needed unless you want to test it from your host.
    expose:
      - "4416"
    healthcheck:
      # Use node (always available in the image) to check the server responds.
      # Exits 0 for any HTTP response, 1 if connection refused/timeout.
      # This avoids relying on wget/curl exit codes for non-2xx warning responses.
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:4416/',function(r){process.exit(0)}).on('error',function(){process.exit(1)})\""]
      interval: 20s
      timeout: 10s
      start_period: 30s
      retries: 5

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clipper
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI API server (CPU — no GPU needed) ──────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/clipper
      REDIS_URL: redis://redis:6379/0
      BGUTIL_POT_SERVER_URL: http://bgutil-provider:4416
      HF_HOME: /app/.cache/huggingface
    ports:
      - "8000:8000"
    volumes:
      - whisper_cache:/app/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bgutil-provider:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # ── Celery worker  (GPU required for h264_nvenc) ──────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    restart: unless-stopped
    command:
      - "celery"
      - "-A"
      - "app.tasks.celery_app"
      - "worker"
      - "--loglevel=info"
      - "--concurrency=2"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/clipper
      REDIS_URL: redis://redis:6379/0
      BGUTIL_POT_SERVER_URL: http://bgutil-provider:4416
      HF_HOME: /app/.cache/huggingface
      TRITON_CACHE_DIR: /tmp/.triton
    volumes:
      - whisper_cache:/app/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bgutil-provider:
        condition: service_healthy
    # Expose the NVIDIA GPU to the container for h264_nvenc
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, video]

volumes:
  postgres_data:
  redis_data:
  whisper_cache:
