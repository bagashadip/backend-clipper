# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml  —  local development & integration testing
#
# Prerequisites:
#   - NVIDIA GPU + drivers on the host
#   - NVIDIA Container Toolkit  (https://docs.nvidia.com/datacenter/cloud-native/)
#
# Usage:
#   docker compose up --build
#
# GCP deployment note:
#   - Push the backend image to Artifact Registry, then deploy to GKE with a
#     GPU node pool (T4 / L4) or GCE with the nvidia-container-toolkit installed.
#   - Set GPU resource requests in the GKE deployment manifest for the worker.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Cobalt API (YouTube download proxy) ───────────────────────────────────
  # Self-hosted Cobalt instance that tunnels/proxies YouTube downloads
  # through its own server, eliminating googlevideo.com IP-restriction
  # 403 errors that plague datacenter IPs.
  # Docs: https://github.com/imputnet/cobalt
  cobalt:
    image: ghcr.io/imputnet/cobalt:latest
    restart: unless-stopped
    environment:
      API_URL: "http://cobalt:9000"
      # YouTube cookies for authentication (required on datacenter IPs)
      COOKIE_PATH: "/cookies.json"
    volumes:
      - ./cookies.json:/cookies.json:ro
    expose:
      - "9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9000/ || exit 1"]
      interval: 20s
      timeout: 10s
      start_period: 30s
      retries: 5

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clipper
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI API server (CPU — no GPU needed) ──────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/clipper
      REDIS_URL: redis://redis:6379/0
      COBALT_API_URL: http://cobalt:9000
      HF_HOME: /app/.cache/huggingface
    ports:
      - "8000:8000"
    volumes:
      - whisper_cache:/app/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      cobalt:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # ── Celery worker  (GPU required for h264_nvenc) ──────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    restart: unless-stopped
    command:
      - "celery"
      - "-A"
      - "app.tasks.celery_app"
      - "worker"
      - "--loglevel=info"
      - "--concurrency=2"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/clipper
      REDIS_URL: redis://redis:6379/0
      COBALT_API_URL: http://cobalt:9000
      HF_HOME: /app/.cache/huggingface
      TRITON_CACHE_DIR: /tmp/.triton
    volumes:
      - whisper_cache:/app/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      cobalt:
        condition: service_healthy
    # Expose the NVIDIA GPU to the container for h264_nvenc
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, video]

volumes:
  postgres_data:
  redis_data:
  whisper_cache:
